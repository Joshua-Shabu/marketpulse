# Convenience for local development: `docker compose up --build`
# Reads your real .env file for the FRED_API_KEY, same as running uvicorn directly.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Adjust the left-hand filename below to match whatever db.py actually
      # names the SQLite file, so data survives container restarts.
      - ./marketpulse.db:/app/marketpulse.db
